name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read # checkout
  pages: write # publish
  id-token: write # OIDC token for the deploy step

# Let an in-flight deploy finish instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Installs dependencies, builds the site and uploads the Pages artifact.
      # Package manager and version are detected from pnpm-lock.yaml and the
      # `packageManager` field in package.json.
      - name: Install, build and upload
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
